services:
  - type: web
    name: gender-by-ivorian-names
    runtime: python
    plan: free
    branch: main
    # Installe uniquement les dépendances de l'app, aux versions de uv.lock
    buildCommand: pip install uv && uv sync --frozen
    startCommand: .venv/bin/python app_gradio.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # uv utilise le Python de Render au lieu d'en télécharger un
      - key: UV_PYTHON_DOWNLOADS
        value: never
      - key: HF_MODEL_REPO
        value: LeMental/gender-by-ivorian-names-model
      - key: HF_TOKEN
        sync: false
      - key: APP_PASSWORD
        sync: false
